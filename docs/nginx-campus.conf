# Configuración de nginx para el campus en un servidor propio (Debian + PHP-FPM).
# Copiar como /etc/nginx/sites-available/campus, enlazarla en sites-enabled,
# revisar con "sudo nginx -t" y aplicar con "sudo systemctl reload nginx".
#
# nginx no lee los .htaccess: estas reglas son las que impiden descargar desde internet
# las cuentas de alumnos, la base de ProgMesas, la configuración y el código interno.

server {
	listen 80 default_server;
	listen [::]:80 default_server;

	root /var/www/final;   # carpeta donde está el campus
	index index.php index.html;
	server_name _;

	# Datos y código interno: solo se leen desde PHP, nunca por HTTP
	location ^~ /campus/data/      { return 404; }
	location ^~ /campus/includes/  { return 404; }
	location ^~ /progmesas/backend/uploads/ {
		# Los PDF de los programas de examen sí se pueden abrir
		location ~* \.pdf$ { add_header X-Content-Type-Options nosniff; }
		return 404;
	}
	location ^~ /progmesas/backend/ { return 404; }
	location ^~ /docker/            { return 404; }
	location ^~ /herramientas/      { return 404; }
	location ~ /\.                  { return 404; }   # .env, .git, .htaccess, .vscode
	location ~* \.(sqlite|sqlite3|db|sql|zip|bak|xlsx|env|log)$ { return 404; }

	location / {
		try_files $uri $uri/ =404;
	}

	location ~ \.php$ {
		include snippets/fastcgi-php.conf;
		fastcgi_pass unix:/run/php/php8.4-fpm.sock;   # ajustar a la versión de PHP instalada
		fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
		fastcgi_hide_header X-Powered-By;
	}
}
